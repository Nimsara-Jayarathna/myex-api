name: Deploy blipzo-api

on:
  push:
    branches: [main, dev]
    paths:
      - "blipzo-api/src/**"
      - "blipzo-api/Dockerfile"
      - "blipzo-api/docker-compose.yml"
      - "blipzo-api/package.json"
      - "blipzo-api/package-lock.json"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "blipzo-api/src/**"
      - "blipzo-api/Dockerfile"
      - "blipzo-api/docker-compose.yml"
      - "blipzo-api/package.json"
      - "blipzo-api/package-lock.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blipzo-api-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: blipzo-api
  DOCKER_NETWORK: npm_default

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.vars.outputs.deploy_env }}
      image: ${{ steps.vars.outputs.image }}
      image_tag_env: ${{ steps.vars.outputs.image_tag_env }}
      image_tag_sha: ${{ steps.vars.outputs.image_tag_sha }}
      app_dir: ${{ steps.vars.outputs.app_dir }}
      compose_project_name: ${{ steps.vars.outputs.compose_project_name }}
      docker_network: ${{ steps.vars.outputs.docker_network }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deployment variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="$(git rev-parse --short HEAD)"
          # GHCR requires lowercase names; keep image under the owner namespace
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/blipzo-api"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            DEPLOY_ENV="production"
            IMAGE_TAG_ENV="prod"
            APP_DIR="/var/www/blipzo-api"
            COMPOSE_PROJECT_NAME="blipzo-prod"
          else
            DEPLOY_ENV="staging"
            IMAGE_TAG_ENV="stg"
            APP_DIR="/var/www/blipzo-api-staging"
            COMPOSE_PROJECT_NAME="blipzo-stg"
          fi

          DOCKER_NETWORK_FROM_SECRET="${{ secrets.NPM_NET_NAME }}"
          DOCKER_NETWORK_EFFECTIVE="${DOCKER_NETWORK_FROM_SECRET:-${DOCKER_NETWORK}}"

          echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag_env=${IMAGE_TAG_ENV}" >> "$GITHUB_OUTPUT"
          echo "image_tag_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "app_dir=${APP_DIR}" >> "$GITHUB_OUTPUT"
          echo "compose_project_name=${COMPOSE_PROJECT_NAME}" >> "$GITHUB_OUTPUT"
          echo "docker_network=${DOCKER_NETWORK_EFFECTIVE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on push events)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.image_tag_env }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.image_tag_sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    environment: ${{ needs.build.outputs.deploy_env }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DOCKER_NETWORK: ${{ needs.build.outputs.docker_network }}
      APP_DIR: ${{ needs.build.outputs.app_dir }}
      COMPOSE_PROJECT_NAME: ${{ needs.build.outputs.compose_project_name }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.image_tag_env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment file secret
        id: envfile
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            ENV_FILE="${{ secrets.PROD_ENV_FILE }}"
          else
            ENV_FILE="${{ secrets.STG_ENV_FILE }}"
          fi

          echo "::add-mask::$ENV_FILE"
          {
            echo "ENV_FILE<<__EOF__"
            printf '%s\n' "$ENV_FILE"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::$SSH_HOST"
          echo "::add-mask::$SSH_PORT"
          echo "::add-mask::$SSH_USER"
          echo "::add-mask::$SSH_PRIVATE_KEY"

          if [ -z "${SSH_PORT:-}" ] || ! echo "$SSH_PORT" | grep -Eq '^[0-9]+$'; then
            echo "Invalid SSH_PORT" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_OPTS=-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Create app directory on server
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "sudo mkdir -p '$APP_DIR' && sudo chown '$SSH_USER:$SSH_USER' '$APP_DIR'"

      - name: Sync app directory to server
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.github' \
            --exclude '.gitlab-ci.yml' \
            --exclude '.env' \
            "./blipzo-api/" "$SSH_USER@$SSH_HOST:$APP_DIR/" -e "ssh $SSH_OPTS -p $SSH_PORT"

      - name: Upload .env to server (raw)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ENV_FILE" | ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cat > '$APP_DIR/.env'"

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' IMAGE='$IMAGE' NPM_NET_NAME='$DOCKER_NETWORK' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"

          if docker compose version >/dev/null 2>&1; then
            DC="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            echo "Docker Compose not available" >&2
            exit 1
          fi

          if ! docker network inspect "$NPM_NET_NAME" >/dev/null 2>&1; then
            docker network create --driver bridge "$NPM_NET_NAME"
          fi

          IMAGE="$IMAGE" $DC -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml pull
          IMAGE="$IMAGE" $DC -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml up -d
          docker image prune -f
          EOF
